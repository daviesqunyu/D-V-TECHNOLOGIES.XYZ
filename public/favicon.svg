<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark base background -->
  <rect width="64" height="64" rx="14" fill="#080812"/>

  <!-- Animated-style rotating ring (static gradient border) -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none"
    stroke="url(#grad1)" stroke-width="2.5" opacity="0.9" filter="url(#outerGlow)"/>

  <!-- Subtle nano grid -->
  <g stroke="#00e5ff" stroke-width="0.3" opacity="0.12">
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
  </g>

  <!-- Inner glow area -->
  <rect x="8" y="8" width="48" height="48" rx="10"
    fill="url(#grad1)" opacity="0.07"/>

  <!-- D letterform -->
  <path
    d="M10 14 L10 50 L24 50 C34 50 42 43 42 32 C42 21 34 14 24 14 Z"
    fill="none"
    stroke="url(#grad1)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <!-- D inner fill hint -->
  <path
    d="M16 20 L23 20 C30 20 36 25.5 36 32 C36 38.5 30 44 23 44 L16 44 Z"
    fill="url(#grad1)"
    opacity="0.15"
  />

  <!-- V letterform (overlapping right side) -->
  <path
    d="M38 14 L48 40 L58 14"
    fill="none"
    stroke="url(#grad1)"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Circuit node dots -->
  <circle cx="10" cy="14" r="2.5" fill="#00e5ff" opacity="0.95" filter="url(#glow)"/>
  <circle cx="10" cy="50" r="2.5" fill="#00e5ff" opacity="0.95" filter="url(#glow)"/>
  <circle cx="42" cy="32" r="2.5" fill="#8b5cf6" opacity="0.95" filter="url(#glow)"/>
  <circle cx="38" cy="14" r="2.5" fill="#ff6b00" opacity="0.95" filter="url(#glow)"/>
  <circle cx="58" cy="14" r="2.5" fill="#ff6b00" opacity="0.95" filter="url(#glow)"/>
  <circle cx="48" cy="40" r="2.5" fill="#8b5cf6" opacity="0.95" filter="url(#glow)"/>

  <!-- Corner accent dots -->
  <circle cx="6" cy="6" r="1.5" fill="#00e5ff" opacity="0.7"/>
  <circle cx="58" cy="6" r="1.5" fill="#00e5ff" opacity="0.7"/>
  <circle cx="6" cy="58" r="1.5" fill="#00e5ff" opacity="0.7"/>
  <circle cx="58" cy="58" r="1.5" fill="#00e5ff" opacity="0.7"/>
</svg>
