<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a000ff"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="33%" stop-color="#a000ff"/>
      <stop offset="66%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowV" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feFlood flood-color="#a000ff" flood-opacity="0.6" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="cb"/>
      <feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base dark background -->
  <rect width="64" height="64" rx="14" fill="#06060f"/>

  <!-- Gradient border ring -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.9" filter="url(#glow)"/>

  <!-- Subtle nano grid -->
  <g stroke="#00e5ff" stroke-width="0.3" opacity="0.1">
    <line x1="0" y1="21" x2="64" y2="21"/><line x1="0" y1="42" x2="64" y2="42"/>
    <line x1="21" y1="0" x2="21" y2="64"/><line x1="42" y1="0" x2="42" y2="64"/>
  </g>

  <!-- Centre ambient glow -->
  <ellipse cx="32" cy="34" rx="22" ry="18" fill="url(#gD)" opacity="0.07"/>

  <!-- ── D letter ── -->
  <!-- D filled body (evenodd) -->
  <path
    d="M6 7 L6 57 L26 57 C41 57 50 48 50 32 C50 16 41 7 26 7 Z
       M13 16 L24 16 C35 16 41 23 41 32 C41 41 35 48 24 48 L13 48 Z"
    fill="url(#gD)" fill-opacity="0.65" fill-rule="evenodd"
    filter="url(#glow)"/>
  <!-- D outer stroke for crispness -->
  <path d="M6 7 L6 57 L26 57 C41 57 50 48 50 32 C50 16 41 7 26 7 Z"
    fill="none" stroke="url(#gD)" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- ── V letter ── -->
  <!-- V thick glow halo -->
  <path d="M51 7 L57 50 L63 7" stroke="url(#gV)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.12"/>
  <!-- V main bold stroke -->
  <path d="M51 7 L57 50 L63 7" stroke="url(#gV)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowV)" opacity="0.75"/>
  <!-- V crisp inner line -->
  <path d="M51 7 L57 50 L63 7" stroke="url(#gV)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowV)"/>

  <!-- Circuit node dots -->
  <circle cx="6" cy="7" r="3.5" fill="#00e5ff" opacity="0.25"/><circle cx="6" cy="7" r="2" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="6" cy="57" r="3.5" fill="#00e5ff" opacity="0.25"/><circle cx="6" cy="57" r="2" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="50" cy="32" r="3.5" fill="#7c3aed" opacity="0.25"/><circle cx="50" cy="32" r="2" fill="#7c3aed" filter="url(#glow)"/>
  <circle cx="51" cy="7" r="3.5" fill="#a000ff" opacity="0.25"/><circle cx="51" cy="7" r="2" fill="#a000ff" filter="url(#glow)"/>
  <circle cx="63" cy="7" r="3.5" fill="#ff6b00" opacity="0.25"/><circle cx="63" cy="7" r="2" fill="#ff6b00" filter="url(#glow)"/>
  <circle cx="57" cy="50" r="3.5" fill="#ff6b00" opacity="0.25"/><circle cx="57" cy="50" r="2" fill="#ff6b00" filter="url(#glow)"/>

  <!-- Corner accent dots -->
  <circle cx="6" cy="6" r="1.8" fill="#00e5ff" opacity="0.8"/>
  <circle cx="58" cy="6" r="1.8" fill="#00ff88" opacity="0.8"/>
  <circle cx="6" cy="58" r="1.8" fill="#a000ff" opacity="0.8"/>
  <circle cx="58" cy="58" r="1.8" fill="#ff6b00" opacity="0.8"/>
</svg>
